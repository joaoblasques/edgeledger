[project]
name = "edgeledger"
version = "0.1.0"
description = "Prediction-market forecast log — a hiring portfolio in measurement and modelling."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "polars>=1.0",
    "deltalake>=0.18",
    "duckdb>=1.0",
    "apache-airflow>=2.9",
    "boto3>=1.43.62",
]

[dependency-groups]
dev = [
    "markdown>=3.10.3",
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgeledger"]
